version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - uploads-data:/app/static/uploads
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade && gunicorn wsgi:application --bind 0.0.0.0:5000 --workers $((2 * $$(nproc 2>/dev/null || echo 1) + 1)) --threads 2 --worker-class gthread --timeout 60 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --reload"

volumes:
  redis-data:
  uploads-data:
